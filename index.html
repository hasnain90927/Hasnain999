<!DOCTYPE html>
<html>
<head>
  <title>I Know...</title>
  <style>
    body {
      background-color: black;
      color: red;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding-top: 100px;
    }

    input {
      padding: 10px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
    }

    #echo {
      margin-top: 30px;
      font-size: 22px;
      display: none;
      color: white;
    }
  </style>
</head>
<body>
  <h2>Type anything...</h2>
  <input type="text" id="userInput" placeholder="Go on..." />
  <div id="echo"></div>

  <script>
    const input = document.getElementById("userInput");
    const echo = document.getElementById("echo");

    input.addEventListener("input", () => {
      const value = input.value.trim();
      if (value.length > 0) {
        echo.style.display = "block";
        echo.textContent = "${value}"... I knew you'd type that.;
      } else {
        echo.style.display = "none";
      }
    });
  </script>
</body>
</html>
